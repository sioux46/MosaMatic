<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MosaMatic modern</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid mt-4 mb-5">
        <h1 class="text-center mb-0">MosaMatic</h1>
        <h5 class="text-center mb-2">Moderne</h1>
        <form id="mosaicForm">
          <!---->
          <div class="row mb-1">
              <div class="col-md-3 col-sm-6 mb-1">
                <div class="input-group">
                  <div class="input-group-text">Carré 1x1&nbsp;</div>
                  <input type="color" id="color1" value="#9d947d" class="form-control color-input">
                </div>
              </div>
              <div class="col-md-3 col-sm-6 mb-1">
                <div class="input-group">
                  <div class="input-group-text">Carré 2x2</div>
                  <input type="color" id="color2" value="#dccbcc" class="form-control color-input">
                </div>
              </div>
              <div class="col-md-3 col-sm-6 mb-1">
                <div class="input-group">
                  <div class="input-group-text">Rect. 1x2&nbsp;</div>
                  <input type="color" id="color3" value="#646d82" class="form-control color-input">
                </div>
              </div>
              <div class="col-md-3 col-sm-6 mb-1">
                <div class="input-group">
                  <div class="input-group-text">Rect. 2x1&nbsp;</div>
                  <input type="color" id="color4" value="#afc1c0" class="form-control color-input">
                </div>
              </div>
          </div>
          <!---->
          <div class="row mb-2">
            <div class="col">
              <div class="input-group">
                <div class="input-group-text">H</div>
                <input type="number" id="height" class="form-control" placeholder="Hauteur (H)" value="6">
              </div>
            </div>
            <div class="col">
              <div class="input-group">
                <div class="input-group-text">L</div>
                <input type="number" id="width" class="form-control" placeholder="Largeur (L)" value="6">
              </div>
            </div>
          </div>
          <!---->


          <div class="row mb-2" style="margin-left: 0rem !important">
            <div class="col">
              <div class="input-group">
                <div class="input-group-text">A</div>
                <input type="number" id="angle" class="form-control" placeholder="" value="30">
              </div>
            </div>



            <div class="col input-group">
              <div class="form-check" >
                <input class="form-check-input" type="checkbox" value="" id="frame">
                <label class="form-check-label" for="frame">Cadre</label>
              </div>
            </div>
            <div class="col input-group">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="tileBorder">
                <label class="form-check-label" for="tileBorder">Bordures</label>
              </div>
            </div>

          </div>


          <!---->
          <div class="row mb-4">
            <div class="col">
                <button id="exportBtn" type="button" class="btn btn-light w-100 mt-2">Exportation de l'image</button>
            </div>
            <div class="col">
                <button type="submit" class="btn btn-dark w-100 mt-2">Génération de la mosaïque</button>
            </div>
          </div>
          <!---->
        </form>

        <div id="mosaicContainer" class="mt-4"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
