<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!--<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">-->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MosaMagic moderne</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
    <div class="container-fluid mt-4" style="position: relative;">
      <h1 class="text-center" style="margin-bottom:0;"><span>MosaMagic</span></h1>
      <h6 class="text-center">Moderne</h6>
<div class="row"> <!-- global -->
  <div id="col-gauche" class="col-md-6 col-sm-6">
      <form id="mosaicForm" style="position:relative;">
        <!---->
        <div class="row mb-1">
            <div class="col-lg-6 col-md-6 col-6">
              <div class="input-group">
                <div class="input-group-text">
                  <div class="form-check form-switch" >
                    <input class="form-check-input" type="checkbox" checked value="" id="tilec1">
                    <label class="form-check-label" for="tilec1">1x1&nbsp;&nbsp;&nbsp;</label>
                  </div>
                </div>
                <input id="color1" type="color" value="#d05860" class="form-control color-input">
              </div>
            </div>
            <div class="col-lg-6 col-md-6 col-6">
              <div class="input-group">
                <div class="input-group-text">
                  <div class="form-check form-switch" >
                    <input id="tilec2" class="form-check-input" type="checkbox" checked value="" >
                    <label class="form-check-label" for="tilec2">2x2&nbsp;&nbsp;</label>
                  </div>
                </div>
                <input id="color2" type="color" value="#dccbcc" class="form-control color-input">
              </div>
            </div>
            <div class="col-lg-6 col-md-6 col-6">
              <div class="input-group">
                <div class="input-group-text">
                  <div class="form-check form-switch" >
                    <input id="tilec3" class="form-check-input" type="checkbox" checked value="">
                    <label class="form-check-label" for="tilec3">2x1&nbsp;&nbsp;&nbsp;</label>
                  </div>
                </div>
                <input id="color3" type="color" value="#646d82" class="form-control color-input">
              </div>
            </div>
            <div class="col-lg-6 col-md-6 col-6">
              <div class="input-group">
                <div class="input-group-text">
                  <div class="form-check form-switch" >
                    <input id="tilec4" class="form-check-input" type="checkbox" checked value="">
                    <label class="form-check-label" for="tilec4">1x2&nbsp;&nbsp;&nbsp;</label>
                  </div>
                </div>
                <input id="color4" type="color" value="#afc1c0" class="form-control color-input">
              </div>
            </div>
        </div>
        <!---->
        <div class="row mb-1">
        </div>
        <!--                    Large/Haut-->
        <div class="row mb-2">
          <div class="col-1">
          </div>
          <div class="col-md-6 col-6">
            <div class="input-group" style="position: relative;">
              <div class="form-check form-switch">
                <input id="square" class="form-check-input" type="checkbox" checked value="">
                <label class="form-check-label" for="square">L = H</label>
              </div>
            </div>
          </div>
        </div>
        <!---->
        <div class="row mb-0">
          <div class="col-6 col-md-6 col-sm-6">
            <div class="input-group">
              <div class="input-group-text">Large&nbsp;</div>
              <input id="width" type="number" min="2" max="100" step="1" class="form-control" placeholder="Largeur (L)" value="5">
            </div>
          </div>
          <div class="col">
            <input id="width2" type="range" class="form-range" min="2" max="100" step="1" value="5">
          </div>
        </div>
        <!---->
        <div class="row mb-2">
          <div class="col-6 col-md-6 col-sm-6">
            <div class="input-group">
              <div class="input-group-text">Haut&nbsp;&nbsp;&nbsp;</div>
              <input id="height" type="number" min="2" max="100" step="1" class="form-control" placeholder="Hauteur (H)" value="5">
            </div>
          </div>
          <div class="col">
            <input id="height2" type="range" class="form-range" min="2" max="100" step="1" value="5">
          </div>
        </div>
        <!--                    Angles-->
        <div class="row mb-0">
          <div class="col-6 col-md-6 col-sm-6 mb-2">
            <div class="input-group">
              <div class="input-group-text">Angles</div>
              <input id="angle" type="number" min="1" max="200" step="1" class="form-control" placeholder="" value="1">
            </div>
          </div>
          <div class="col">
            <input id="angle2" type="range" class="form-range" min="1" max="100" step="1" value="1">
          </div>
        </div>
        <!--                   Bords  -->
        <div class="row mb-2">
          <div class="col-5">
            <div class="input-group">
              <div class="input-group-text">
                  <label class="form-check-label">Bords</label>
                </div>
              <input id="borderSize" type="number" min="0" max="100" step="1" class="form-control" placeholder="Largeur des bords" value="0">
            </div>
          </div>
          <div class="col-4">
            <input id="borderSize2" type="range" class="form-range" min="0" max="100" step="1" value="0">
          </div>
          <div class="col-3">
            <input id="borderColor" type="color" value="#444444" class="form-control color-input">
          </div>
        </div>
        <!--                Joins      Fond  -->
        <div class="row mb-3">
          <div class="col-md-6 col-6">
            <div class="input-group" style="position: relative;">
              <div class="input-group-text">
                <div class="form-check form-switch">
                  <input id="box" class="form-check-input" type="checkbox" value="">
                  <label class="form-check-label" for="box">Joins</label>
                </div>
              </div>
              <input id="boxColor" type="color" value="#000000" class="form-control color-input">
            </div>
          </div>
          <div class="col-md-6 col-6">
            <div class="input-group">
              <div class="input-group-text">
                <div class="form-check form-switch">
                  <input id="back" class="form-check-input" type="checkbox" value="">
                  <label class="form-check-label" for="back">Fond</label>
                </div>
              </div>
              <input id="backColor" type="color" value="#444444" class="form-control color-input">
            </div>
          </div>
        </div>
        <!---->
        <div class="row">
          <div id="gap" class="mb-3"></div> <!-- gap -->
        </div>
        <!--                   Cadre  -->
        <div class="row mb-2">
          <div class="col-5">
            <div class="input-group">
              <div class="input-group-text">
                  <label class="form-check-label">Cadre</label>
                </div>
              <input id="frameSize" type="number" min="0" max="100" step="1" class="form-control" placeholder="Largeur des bords" value="0">
            </div>
          </div>
          <div class="col-4">
            <input id="frameSize2" type="range" class="form-range" min="0" max="100" step="1" value="0">
          </div>
          <div class="col-3">
            <input id="frameColor" type="color" value="#afc1c0" class="form-control color-input">
          </div>
        </div>

        <div class="row">
          <div class="col-5 col-md-6 col-sm-5 mb-2">
            <div class="input-group">
              <div class="input-group-text">Marge</div>
              <input id="paddingSize" type="number" min="0" max="100" step="1" class="form-control" placeholder="Taille de la marge" value="0">
            </div>
          </div>
          <div class="col">
            <input id="paddingSize2" type="range" class="form-range" min="0" max="100" step="1" value="0">
          </div>
        </div>
        <!---->
        <div class="row mb-1">
          <div class="col-5 col-md-6 col-sm-5">
            <div class="input-group">
              <div class="input-group-text">Angle&nbsp;</div>
              <input id="frameAngle" type="number" min="0" max="800" step="1" class="form-control" placeholder="Angle du cadre" value="0">
            </div>
          </div>
          <div class="col">
            <input id="frameAngle2" type="range" class="form-range" min="0" max="800" step="1" value="0">
          </div>
        </div>
        <!---->
        <div class="row mb-1">
          <div class="col-md-2 col-5">
            <div class="input-group" style="position: relative;">
              <div class="form-check form-switch">
                <input id="rogner" class="form-check-input" type="checkbox" value="">
                <label class="form-check-label" for="rogner">Rognage</label>
              </div>
            </div>
          </div>
        </div>
        <!---->
        <div class="row mb-0">
          <div class="col-md-2 col-5">
            <div class="input-group" style="position: relative;">
              <div class="form-check form-switch">
                <input id="anim" class="form-check-input" type="checkbox" value="">
                <label class="form-check-label" for="anim">Animation</label>
              </div>
            </div>
          </div>
          <div class="col ms-5">
            <input id="anim2" type="range" class="form-range" min="100" max="5000" step="1" value="2500" style="transform: scaleX(-1);">
          </div>
        </div>
        <!--     place  de  la   sauvegarde                -->

        <div class="row mb-2 mt-0">
          <div class="col-3">
          </div>
          <div class="col-6">
              <button id="submit" type="submit" class="btn btn-sm btn-dark w-100"><strong>C'est magique !</strong></button>
          </div>
          <div class="col-3">
          </div>
        </div>
        <!---->
      </form>
  </div> <!--fin col gauche-->
  <div id="col-droite" class="col-md-6 col-sm-6">
      <!---->
      <div class= "row">
        <div class= "col-12">
          <div  id="mosaicContainer"></div>  <!--class="transition-width"-->
        </div>
      </div>
      <div class= "row mb-2">
        <div class= "col-4">
          <button id="btnZoom" type="button" class="btn btn-sm btn-light w-100">Zoom</button>
        </div>
        <div class= "col-4">
          <button id="btnMosaMagic" type="button" class="btn btn-sm btn-light w-100">Magic</button>
        </div>
        <div class= "col-4">
          <button id="btnCapture" type="button" class="btn btn-sm btn-light w-100">Photo</button>
        </div>
        <!--
        <div class= "col-2">
          <button id="start" type="button" class="btn btn-sm btn-light w-100">V start</button>
        </div>
        <div class= "col-2">
          <button id="stop" type="button" class="btn btn-sm btn-light w-100">V stop</button>
        </div>
        -->
      </div>
      <!-- sauvegarde -->
      <div class="row mb-0">
        <div class="col-6">
          <input id="saveName" type="text"
                 class="form-control form-control-sm"
                 placeholder="Nom sauvegarde">
        </div>
        <div class="col-6">
          <select id="loadSelect"
                  class="form-select form-select-sm">
            <option value="">Charger…</option>
          </select>
        </div>
      </div>
      <!---->
      <div class="row mb-2">
        <div class="col-6">
          <button id="saveBtn" type="button"
                  class="btn btn-sm btn-success w-100">
            Sauver
          </button>
        </div>
        <div class="col-6">
          <select id="deleteSelect"
                  class="form-select form-select-sm text-danger">
            <option value="">Supprimer…</option>
          </select>
        </div>
      </div>
      <!--  fin sauvegarde -->

      <!--
      <div class= "row">
          <div id="capture">
            <h1>Ma vidéo</h1>
            <p>Contenu animé</p>
        </div>
      </div>-->
    </div>


    <!--</div>-->
  </div> <!--fin col droite-->
</div> <!--fin row form-->
    </div>  <!-- fin container -->

    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>


    <script src="script.js"></script>
</body>
</html>
