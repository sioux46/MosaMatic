<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MosaMagic moderne</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid mt-4" style="position: relative; top: -20px;">
      <h1 class="text-center" style="margin-bottom:0;"><span>MosaMagic</span></h1>
      <h6 class="text-center">Moderne</h6>

      <form id="mosaicForm" style="position:relative; top: -5px">
        <!---->
        <div class="row mb-1">
            <div class="col-md-3 col-6">
              <div class="input-group">
                <div class="input-group-text">
                  <div class="form-check form-switch" >
                    <input class="form-check-input" type="checkbox" checked value="" id="tilec1">
                    <label class="form-check-label" for="tilec1">1x1</label>
                  </div>
                </div>
                <input type="color" id="color1" value="#d05860" class="form-control color-input">
              </div>
            </div>
            <div class="col-md-3 col-6">
              <div class="input-group">
                <div class="input-group-text">
                  <div class="form-check form-switch" >
                    <input class="form-check-input" type="checkbox" checked value="" id="tilec2">
                    <label class="form-check-label" for="tilec2">2x2</label>
                  </div>
                </div>
                <input type="color" id="color2" value="#dccbcc" class="form-control color-input">
              </div>
            </div>
            <div class="col-md-3 col-6">
              <div class="input-group">
                <div class="input-group-text">
                  <div class="form-check form-switch" >
                    <input class="form-check-input" type="checkbox" checked value="" id="tilec3">
                    <label class="form-check-label" for="tilec3">2x1</label>
                  </div>
                </div>
                <input type="color" id="color3" value="#646d82" class="form-control color-input">
              </div>
            </div>
            <div class="col-md-3 col-6">
              <div class="input-group">
                <div class="input-group-text">
                  <div class="form-check form-switch" >
                    <input class="form-check-input" type="checkbox" checked value="" id="tilec4">
                    <label class="form-check-label" for="tilec4">1x2</label>
                  </div>
                </div>
                <input type="color" id="color4" value="#afc1c0" class="form-control color-input">
              </div>
            </div>
        </div>
        <!---->
        <div class="row mb-1">
        </div>
        <!--                   Angle  Large  Haut-->
        <div class="row mb-0">
          <div class="col-5 col-md-3 col-sm-4">
            <div class="input-group">
              <div class="input-group-text">Angle</div>
              <input type="number" id="angle" min="0" max="400" step="1" style="padding-left:3px;" class="form-control" placeholder="" value="30">
            </div>
          </div>
          <div class="col">
            <input type="range" class="form-range" min="0" max="200" step="1" value="30" id="angle2">
          </div>
        </div>
        <div class="row mb-0">
          <div class="col-5 col-md-3 col-sm-4">
            <div class="input-group">
              <div class="input-group-text">Large</div>
              <input type="number" min="3" max="200" step="1"  id="width" class="form-control" placeholder="Largeur (L)" value="6">
            </div>
          </div>
          <div class="col">
            <input type="range" class="form-range" min="3" max="100" step="1" value="6" id="width2">
          </div>
        </div>
        <div class="row mb-0">
          <div class="col-5 col-md-3 col-sm-4">
            <div class="input-group">
              <div class="input-group-text">Haut&nbsp;&nbsp;</div>
              <input type="number" id="height" min="3" max="200" step="1" class="form-control" placeholder="Hauteur (H)" value="6">
            </div>
          </div>
          <div class="col">
            <input type="range" class="form-range" min="3" max="100" step="1" value="6" id="height2">
          </div>
        </div>
        <!--                 L = H      Bords  -->
        <div class="row mb-1">
          <div class="col-md-3 col-6">
            <div class="input-group" style="position: relative; left: 26px;">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" checked value="" id="square">
                <label class="form-check-label" for="square">L = H</label>
              </div>
            </div>
          </div>
          <div class="col-md-3 col-6">
            <div class="input-group">
              <div class="input-group-text">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" value="" id="tileBorder">
                  <label class="form-check-label" for="tileBorder">Bords</label>
                </div>
              </div>
              <input type="color" id="borderColor" value="#444444" class="form-control color-input">
            </div>
          </div>
        </div>
        <div class="row mb-1">
          <div class="col-md-3 col-6">
            <div class="input-group mt-3">
              <div class="input-group-text">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" value="" id="frame">
                  <label class="form-check-label" for="frame">Cadre</label>
                </div>
              </div>
            <input type="color" id="frameColor" value="#afc1c0" class="form-control color-input">
            </div>
          </div>
          <div class="col-md-3 col-6">
            <div class="input-group">
              <div class="input-group-text">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" value="" id="back">
                  <label class="form-check-label" for="back">Fond&nbsp;&nbsp;</label>
                </div>
              </div>
              <input type="color" id="backColor" value="#444444" class="form-control color-input">
            </div>
          </div>
          <div class="row mb-1">
            <div class="col-md-3 col-6">
              <div class="input-group" style="position: relative; left: 13px;">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" value="" id="rogner">
                  <label class="form-check-label" for="square">Rogner</label>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!--          Angle Taille-->
        <div class="row">
          <div class="col-5 col-md-3 col-sm-4">
            <div class="input-group">
              <div class="input-group-text">Angle</div>
              <input type="number" min="0" max="800" step="1" style="padding-left:3px;"  id="frameAngle" class="form-control" placeholder="Angle du cadre" value="6">
            </div>
          </div>
          <div class="col">
            <input type="range" class="form-range" min="0" max="400" step="1" value="6" id="frameAngle2">
          </div>
        </div>
        <div class="row">
          <div class="col-5 col-md-3 col-sm-4">
            <div class="input-group">
              <div class="input-group-text">Taille&nbsp;</div>
              <input type="number" min="0" max="200" step="1" style="padding-left:3px;" step="1" class="form-control" placeholder="Taille du cadre" value="6" id="frameSize">
            </div>
          </div>
          <div class="col">
            <input type="range" class="form-range" min="0" max="100" step="1" value="6" id="frameSize2">
          </div>
        </div>
        <!---->


        <div class="row mb-2 mt-2">
          <div class="col-6">
              <button id="exportBtn" type="button" class="btn btn-sm btn-light w-100">Export</button>
          </div>
          <div class="col-6">
              <button id="submit" type="submit" class="btn btn-sm btn-dark w-100">Mosaïque</button>
          </div>
        </div>
        <!---->
      </form>
      <!---->
    </div>
    <div  class="container-fluid" style="position: relative; top: -20px;">
      <div  id="mosaicContainer"></div>
      <!--<div id="mosaicContainer" style="position: relative; top: -12px;"></div>
    </div>-->
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
