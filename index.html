<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosaïque Interactive</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">Générateur de Mosaïque</h1>
        <form id="mosaicForm" class="row g-3">
            <div class="col-md-2">
                <label class="form-label">Hauteur (H)</label>
                <input type="number" class="form-control" id="height" min="1" value="6">
            </div>
            <div class="col-md-2">
                <label class="form-label">Largeur (L)</label>
                <input type="number" class="form-control" id="width" min="1" value="6">
            </div>
            <div class="col-md-2">
                <label class="form-label">Couleur 1x1</label>
                <input type="color" id="color1" class="form-control" value="#9d947d">
            </div>
            <div class="col-md-2">
                <label class="form-label">Couleur 2x2</label>
                <input type="color" id="color2" class="form-control" value="#dccbcc">
            </div>
            <div class="col-md-2">
                <label class="form-label">Couleur 1x2</label>
                <input type="color" id="color3" class="form-control" value="#646d82">
            </div>
            <div class="col-md-2">
                <label class="form-label">Couleur 2x1</label>
                <input type="color" id="color4" class="form-control" value="#afc1c0">
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary w-100 mt-2">Générer</button>
            </div>
            <div class="col-md-3">
                <button id="exportBtn" type="button" class="btn btn-secondary w-100 mt-2">Exporter PNG</button>
            </div>
            <div class="col-md-3">
                <button id="toggleManualBtn" type="button" class="btn btn-warning w-100 mt-2">Mode Manuel</button>
            </div>
        </form>

        <div id="mosaicContainer" class="mt-4"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
